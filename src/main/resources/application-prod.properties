# Perfil de Producción (PC Local Windows)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Migraciones Flyway (seguro para BD nueva o ya inicializada con init.sql)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Logs rotativos a archivo
logging.file.name=logs/libreria.log
logging.level.root=INFO
logging.level.com.libreria.libreria=INFO
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
