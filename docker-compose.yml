version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: libreria-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-bd_libreria}
      POSTGRES_USER: ${DB_USER:-user_libreria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user_libreria} -d ${DB_NAME:-bd_libreria}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: libreria-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/${DB_NAME:-bd_libreria}
      - DB_USER=${DB_USER:-user_libreria}
      - DB_PASSWORD=${DB_PASSWORD:?Define DB_PASSWORD en .env}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET Base64 en .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: libreria-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
